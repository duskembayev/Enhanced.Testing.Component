name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Package version to build (without the leading "v").
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Resolve package validation baseline
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'"
            exit 1
          fi
          exclude=(--exclude 'v*-*')
          if [ -n "$VERSION" ]; then
            exclude+=(--exclude "v$VERSION")
          fi
          if baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${exclude[@]}" 2>/dev/null); then
            echo "Package validation baseline: ${baseline#v}"
            echo "PackageValidationBaselineVersion=${baseline#v}" >> "$GITHUB_ENV"
          else
            echo "::warning::No previous release tag found, package validation is skipped"
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts

      - name: Verify package version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          mismatched=()
          for package in artifacts/*.nupkg; do
            [[ "$package" == *".$VERSION.nupkg" ]] || mismatched+=("$package")
          done
          if [ ${#mismatched[@]} -gt 0 ]; then
            echo "::error::Packages do not match version $VERSION: ${mismatched[*]}"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14
